<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#167a54">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | VENDE+</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f6f7f9;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(100%, 520px);
      padding: 36px;
      border: 1px solid #dfe4eb;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 12px 36px rgb(23 32 51 / 8%);
    }
    .brand {
      color: #172033;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -.06em;
      text-decoration: none;
    }
    .brand span { color: #2456c7; }
    .code {
      margin: 34px 0 10px;
      color: #2456c7;
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .12em;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.7rem, 6vw, 2.25rem);
      line-height: 1.15;
      letter-spacing: -.04em;
    }
    p { color: #627086; line-height: 1.65; }
    .button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
      padding: 12px 18px;
      border-radius: 7px;
      background: #2456c7;
      color: #fff;
      font-size: .9rem;
      font-weight: 700;
      text-decoration: none;
    }
    .button:focus-visible {
      outline: 3px solid #8eafff;
      outline-offset: 3px;
    }
    @media (max-width: 480px) {
      main { padding: 26px 22px; }
    }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/#inicio" aria-label="VENDE+ início">VENDE<span>+</span></a>
    <p class="code">ERRO 404</p>
    <h1>Esta página não foi encontrada.</h1>
    <p>O endereço pode estar incorreto ou o conteúdo pode não estar mais disponível.</p>
    <a class="button" href="/#inicio">Voltar à vitrine</a>
  </main>
</body>
</html>
