name: VENDE+ — Preparar recuperação de senha
on:
  push:
    branches: [feat/ux-compra-venda-v2]
    paths:
      - functions/_shared/password-reset.ts
      - migrations/0004_password_resets.sql
      - scripts/setup-password-reset.mjs
      - tests/password-reset.test.mjs
      - .github/workflows/password-reset-setup.yml
permissions:
  contents: read
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verificar uso único, expiração, sessões e limites
        run: node --experimental-strip-types --test tests/password-reset.test.mjs
      - name: Criar apenas a tabela de recuperação nos bancos separados
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/setup-password-reset.mjs
