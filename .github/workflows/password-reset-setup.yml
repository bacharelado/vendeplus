name: VENDE+ — Preparar recuperação de senha
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Banco que receberá somente a migração 0004'
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production
      confirm_production:
        description: 'Para produção, digite APLICAR_MIGRACAO_0004'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: vendeplus-password-reset-migration
  cancel-in-progress: false
jobs:
  preparar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verificar recuperação, expiração e bloqueio de abuso
        run: node --experimental-strip-types --test tests/password-reset.test.mjs
      - name: Conferir sintaxe do preparador
        run: node --check scripts/setup-password-reset.mjs
      - name: Aplicar somente a migração 0004 no ambiente escolhido
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PASSWORD_RESET_TARGET: ${{ inputs.target }}
          CONFIRM_PASSWORD_RESET_PRODUCTION: ${{ inputs.confirm_production }}
        run: node scripts/setup-password-reset.mjs
