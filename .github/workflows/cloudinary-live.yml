name: VENDE+ — Fotos reais na prévia
on:
  push:
    branches: [feat/cloudinary-fotos-free, fix/piloto-poranga-agora]
    paths:
      - 'functions/**'
      - 'src/**'
      - 'migrations/**'
      - scripts/d1-migrations.mjs
      - 'tests/fixtures/**'
      - scripts/audit-cloudinary-live.mjs
      - .github/workflows/cloudinary-live.yml
  workflow_dispatch:
    inputs:
      preview_branch:
        description: 'Branch da prévia a testar'
        required: true
      preview_sha:
        description: 'SHA completo do deploy da prévia'
        required: true
permissions:
  contents: read
concurrency:
  group: vendeplus-cloudinary-live
  cancel-in-progress: false
jobs:
  auditar:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && (github.ref_name == 'fix/piloto-poranga-agora' || github.ref_name == 'feat/cloudinary-fotos-free'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Testar contas e fotos no deploy deste commit e limpar somente dados QA
        env:
          PREVIEW_BRANCH: ${{ inputs.preview_branch || github.ref_name }}
          PREVIEW_SHA: ${{ inputs.preview_sha || github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/audit-cloudinary-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudinary-live-${{ github.sha }}
          path: artifacts/cloudinary-live/
          retention-days: 7
