name: VENDE+ — Preparar publicação autorizada
on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: 'SHA completo da main autorizado para preparar o D1'
        required: true
permissions:
  contents: read
concurrency:
  group: vendeplus-production-preparation
  cancel-in-progress: false
jobs:
  preparar:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approved_commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar proteções da preparação
        run: node --test tests/production-setup.test.mjs
      - name: Criar banco exclusivo e preparar funções de produção
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/prepare-production.mjs
