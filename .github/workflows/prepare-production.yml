name: VENDE+ — Preparar publicação autorizada
on:
  push:
    branches: [feat/vendeplus-2.0]
    paths:
      - scripts/prepare-production.mjs
      - tests/production-setup.test.mjs
      - .github/workflows/prepare-production.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vendeplus-production-preparation
  cancel-in-progress: false
jobs:
  preparar:
    if: github.ref == 'refs/heads/feat/vendeplus-2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar proteções da preparação
        run: node --test tests/production-setup.test.mjs
      - name: Criar banco exclusivo e preparar funções de produção
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/prepare-production.mjs
