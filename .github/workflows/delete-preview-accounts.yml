name: VENDE+ — Excluir duas contas da prévia
on:
  push:
    branches: [ops/excluir-contas-previa-20261112]
    paths:
      - scripts/delete-preview-accounts.mjs
      - .github/workflows/delete-preview-accounts.yml
permissions:
  contents: read
concurrency:
  group: vendeplus-delete-preview-accounts
  cancel-in-progress: false
jobs:
  excluir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Excluir somente as duas contas da prévia e verificar total oficial
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/delete-preview-accounts.mjs
