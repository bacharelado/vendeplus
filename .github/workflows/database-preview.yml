name: VENDE+ — Conectar banco da prévia
on:
  push:
    branches: [feat/ux-compra-venda-v2]
    paths:
      - .github/workflows/database-preview.yml
      - scripts/connect-preview-database.mjs
      - migrations/0001_marketplace.sql
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vendeplus-database-preview
  cancel-in-progress: false
jobs:
  conectar:
    if: github.ref == 'refs/heads/feat/ux-compra-venda-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código da branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar proteções da automação
        run: node --test tests/preview-database.test.mjs
      - name: Criar banco, aplicar tabelas e validar somente preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/connect-preview-database.mjs
