name: VENDE+ — Conectar banco da prévia
on:
  push:
    branches: [feat/vendeplus-2.0]
    paths:
      - .github/workflows/database-preview.yml
      - scripts/connect-preview-database.mjs
      - 'migrations/*.sql'
      - 'functions/**'
      - scripts/test-preview-accounts.mjs
      - scripts/audit-real-account.mjs
      - src/components/SellerArea.tsx
      - tests/preview-database.test.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vendeplus-database-preview
  cancel-in-progress: false
jobs:
  conectar:
    if: github.ref == 'refs/heads/feat/vendeplus-2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código da branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar proteções da automação
        run: node --test tests/preview-database.test.mjs
      - name: Criar banco, aplicar tabelas e validar somente preview
        id: conectar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/connect-preview-database.mjs
      - name: Testar cadastro e envio real, removendo os dados de teste
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_URL: ${{ steps.conectar.outputs.preview_url }}
        run: node scripts/test-preview-accounts.mjs
      - name: Instalar navegador Chromium de auditoria
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Auditar a conta real em navegador e D1 sem mocks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_URL: ${{ steps.conectar.outputs.preview_url }}
        run: node scripts/audit-real-account.mjs
      - name: Guardar evidências da auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vendeplus-auditoria-conta-real
          path: artifacts/audit-real-account/
          retention-days: 7
          if-no-files-found: warn
