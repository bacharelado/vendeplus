name: VENDE+ — Comparar ambientes
on:
  push:
    branches: [ops/comparar-ambientes-20261112]
    paths:
      - scripts/compare-environments.mjs
      - .github/workflows/compare-environments.yml
permissions:
  contents: read
jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comparar configurações, código publicado e respostas públicas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/compare-environments.mjs
