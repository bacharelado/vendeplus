name: VENDE+ — Diagnóstico seguro Cloudflare
on:
  push:
    branches: [feat/cloudinary-fotos-free]
    paths:
      - scripts/inspect-cloudflare.mjs
      - .github/workflows/cloudflare-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspecionar ambientes sem modificar dados ou imprimir credenciais
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          GH_CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: node scripts/inspect-cloudflare.mjs
