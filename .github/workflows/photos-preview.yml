name: VENDE+ — Verificar acesso às fotos
on:
  push:
    branches: [feat/vendeplus-2.0]
    paths:
      - .github/workflows/photos-preview.yml
      - scripts/check-preview-photos.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    if: github.ref == 'refs/heads/feat/vendeplus-2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir acesso ao armazenamento sem mudar configurações
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-preview-photos.mjs
