<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VENDE+ — Protótipo 1.3</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#123C66;--teal:#18B7A4;--amber:#F4A62A;--bg:#F5F8FA;--card:#fff;--tx:#14202B;--mu:#566676;--bd:#DCE4EA;--hd:#123C66;--pri:#123C66;--prt:#fff;--pt:#123C66;--ok:#0B7F72;--warn:#8A5A00;--bad:#B42318;--info:#1D4F91;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1620;--card:#13232F;--tx:#E8EEF3;--mu:#9DB0C0;--bd:#25384A;--hd:#0D2B49;--pri:#18B7A4;--prt:#06231F;--pt:#4FD6C4;--ok:#4FD6C4;--warn:#F4B94F;--bad:#FF8A80;--info:#8DB8F2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1620;--card:#13232F;--tx:#E8EEF3;--mu:#9DB0C0;--bd:#25384A;--hd:#0D2B49;--pri:#18B7A4;--prt:#06231F;--pt:#4FD6C4;--ok:#4FD6C4;--warn:#F4B94F;--bad:#FF8A80;--info:#8DB8F2;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--hd);color:#fff;z-index:9}
.w{max-width:960px;margin:auto;padding:0 16px}
.hd{display:flex;align-items:center;gap:10px;height:52px}
.logo{font:700 22px Poppins,sans-serif}.logo span{color:var(--amber)}
.hd small{opacity:.8;flex:1}
.ic{background:none;border:1px solid #fff5;color:#fff;border-radius:8px;width:40px;height:40px;font-size:18px;cursor:pointer}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
nav a{white-space:nowrap;color:#fff;text-decoration:none;padding:6px 12px;border-radius:99px;font-size:14px;border:1px solid #fff4}
nav a.on{background:var(--amber);color:#1b1200;border-color:var(--amber)}
.bn{background:var(--amber);color:#1b1200;text-align:center;font-size:13px;padding:4px 8px}
main{padding-top:16px;padding-bottom:40px}
h1,h2,h3{font-family:Poppins,sans-serif;line-height:1.25;margin:0 0 8px}h1{font-size:24px}h2{font-size:19px;margin-top:20px}h3{font-size:16px}
p{margin:0 0 10px}a{color:var(--pt)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.li{display:block;text-decoration:none;padding:0;overflow:hidden}
.ph{aspect-ratio:4/3;display:grid;place-items:center;font-size:46px}
.li .b{padding:10px}
.pr{font:600 17px Poppins,sans-serif;color:var(--pt)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 15px Inter,sans-serif;cursor:pointer;text-decoration:none}
.pri{background:var(--pri);color:var(--prt);border-color:transparent}
.wa{background:var(--teal);color:#062B27;border-color:transparent;width:100%;min-height:50px;font-size:16px;margin:10px 0}
.dg{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.sm{min-height:40px;padding:0 12px;font-size:14px}
.bd{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,currentColor 16%,transparent)}
.s-PUBLICADO{color:var(--ok)}.s-EM_ANALISE{color:var(--warn)}.s-PAUSADO{color:var(--mu)}.s-VENDIDO{color:var(--info)}.s-BLOQUEADO,.s-REMOVIDO{color:var(--bad)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
textarea{min-height:96px}input[type=checkbox]{width:20px;min-height:20px;margin-right:8px;vertical-align:middle}
.ck{font-weight:400;display:flex;align-items:flex-start;gap:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.chip{white-space:nowrap;padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font:500 14px Inter,sans-serif}
.chip.on{background:var(--pri);color:var(--prt);border-color:transparent}
.cat{text-align:center;cursor:pointer;font:500 14px Inter,sans-serif}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1;min-width:140px}
.mu{color:var(--mu);font-size:14px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}.stat b{display:block;font:700 24px Poppins,sans-serif;color:var(--pt)}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:20}.ov[hidden]{display:none}
.ov .card{max-width:440px;width:100%;max-height:90%;overflow:auto}
.hero{background:linear-gradient(135deg,#123C66,#0d6b73);color:#fff;border-radius:16px;padding:20px}
.hero input{background:#fff;color:#14202B}
.warnb{background:color-mix(in srgb,var(--amber) 16%,var(--card));border-color:var(--amber)}
.item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.item .ph{width:64px;aspect-ratio:1;font-size:28px;border-radius:10px}
.ph1{border-radius:14px}
.two>*{min-width:0}
.rp{white-space:pre-wrap;overflow-wrap:anywhere;border-left:3px solid var(--amber);padding:4px 10px;margin:6px 0;font-size:14px}
html{-webkit-text-size-adjust:100%}
body[data-area="vendedor"]{--hd:#0B6B61}body[data-area="admin"]{--hd:#2B2F3A}
body[data-area="vendedor"] header{border-bottom:4px solid var(--teal)}body[data-area="admin"] header{border-bottom:4px solid var(--amber)}
.hd small{font-weight:600;letter-spacing:.04em;font-size:12px}
.bn a{color:#1b1200;margin:0 6px;font-weight:600}.bn a[aria-current]{text-decoration:underline}
.lb{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.card,.item b{overflow-wrap:anywhere}
.log{font:13px ui-monospace,monospace;color:var(--mu)}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}}
</style>
</head>
<body>
<header><div class="w hd"><b class="logo">VENDE<span>+</span></b><small id="ar"></small><button class="ic" data-a="theme" aria-label="Alternar tema claro ou escuro">◐</button></div><nav class="w" id="nav" aria-label="Navegação principal"></nav></header>
<div class="bn" id="bn"></div>
<main class="w" id="m"></main>
<div class="ov" id="md" hidden></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=v=>'R$ '+(v/100).toLocaleString('pt-BR',{minimumFractionDigits:2}),P=l=>l.p==null?'Sob orçamento':R(l.p);
const C=[['Alimentação','🍲'],['Moda e acessórios','👗'],['Celulares e eletrônicos','📱'],['Casa e móveis','🛋️'],['Beleza','💄'],['Serviços','🛠️'],['Outros','📦']];
const G={'Alimentação':['#F4A62A','#F9D58B'],'Moda e acessórios':['#18B7A4','#8FE3D8'],'Celulares e eletrônicos':['#123C66','#4F86B8'],'Casa e móveis':['#C98A4B','#EBC79B'],'Beleza':['#D86A9A','#F2B6CE'],'Serviços':['#5B7DB1','#A9C0E3'],'Outros':['#7C8A99','#C3CCD6']};
const L=[
{id:1,o:1,t:'Bolo de pote e docinhos para festa',p:1200,c:'Alimentação',e:'🍰',s:'Doces da Marta',cd:'Novo',d:'Bolo de pote de 200 ml em vários sabores. Encomendas com 2 dias de antecedência.',a:'Retirada no bairro ou entrega combinada',st:'PUBLICADO',v:132,k:18},
{id:2,o:1,t:'Marmitas caseiras do dia',p:1800,c:'Alimentação',e:'🍱',s:'Doces da Marta',cd:'Novo',d:'Arroz, feijão, proteína e salada. Pedidos até as 10h.',a:'Entrega no bairro',st:'PAUSADO',v:40,k:5},
{id:3,o:1,t:'Pacote de salgados congelados',p:3500,c:'Alimentação',e:'🥟',s:'Doces da Marta',cd:'Novo',d:'Cento de salgados congelados. Peço pagamento antecipado de metade para encomendas grandes.',a:'Retirada',st:'EM_ANALISE',v:0,k:0,mr:'Possível pedido de pagamento antecipado'},
{id:4,o:0,t:'Celular Galaxy A12 128 GB',p:45000,c:'Celulares e eletrônicos',e:'📱',s:'Carlos T.',cd:'Usado',d:'Funcionando bem, bateria boa, com carregador. Tela sem riscos.',a:'Encontro em local público',st:'PUBLICADO',v:210,k:31},
{id:5,o:0,t:'Sofá de 3 lugares retrátil',p:85000,c:'Casa e móveis',e:'🛋️',s:'Joana R.',cd:'Usado',d:'Sofá cinza em bom estado. Retirada por conta do comprador.',a:'Retirada',st:'PUBLICADO',v:96,k:9},
{id:6,o:0,t:'Corte de cabelo e barba em domicílio',p:3000,c:'Beleza',e:'💈',s:'Studio do Beto',cd:'Não aplicável',d:'Atendimento com hora marcada. Preço a partir de R$ 30,00.',a:'Atendo na casa do cliente no bairro',st:'PUBLICADO',v:150,k:44},
{id:7,o:0,t:'Conserto de celular e troca de tela',p:null,c:'Serviços',e:'🔧',s:'Assistência Rio Negro',cd:'Não aplicável',d:'Diagnóstico rápido. Orçamento antes de qualquer serviço.',a:'Atendimento na loja',st:'PUBLICADO',v:88,k:20},
{id:8,o:0,t:'Vestido de festa tamanho M',p:12000,c:'Moda e acessórios',e:'👗',s:'Luana S.',cd:'Usado',d:'Usado uma vez. Cor azul, com forro.',a:'Retirada ou encontro combinado',st:'PUBLICADO',v:57,k:6},
{id:9,o:0,t:'Fone Bluetooth novo com caixa',p:900,c:'Celulares e eletrônicos',e:'🎧',s:'Loja do Davi',cd:'Novo',d:'Fone sem fio, lacrado. Garantia de 7 dias.',a:'Entrega no bairro',st:'PUBLICADO',v:301,k:12},
{id:10,o:0,t:'Kit de panelas antiaderentes',p:9000,c:'Casa e móveis',e:'🍳',s:'Joana R.',cd:'Novo',d:'Kit com 5 peças, na caixa.',a:'Retirada',st:'PUBLICADO',v:44,k:4},
{id:11,o:1,t:'Cigarros eletrônicos (vape) importados',p:8000,c:'Outros',e:'💨',s:'Doces da Marta',cd:'Novo',d:'Vários sabores.',a:'Retirada',st:'BLOQUEADO',v:0,k:0,mr:'Item possivelmente proibido'}];
L.forEach(l=>l.g=G[l.c]);
const S={r:'inicio',sel:4,q:'',cat:'Todas',cond:'Todas',ord:'n',ph:0,lock:false,
 queue:[{k:'Automática',lid:3,why:'Possível pedido de pagamento antecipado'},{k:'Denúncia',lid:9,why:'1 denúncia: preço muito abaixo do normal',det:'O preço está muito abaixo do normal para um fone novo. Pode ser golpe.'}],
 ap:[],log:['09:12 · Sistema · Regra em modo de observação sinalizou anúncio 3']};
const hora=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const pubs=()=>L.filter(l=>l.st==='PUBLICADO'),byId=i=>L.find(l=>l.id==i);
const ph=(l,c='',z='')=>`<div class="ph ${c}" style="${z}background:linear-gradient(135deg,${l.g[0]},${l.g[1]})">${l.e}</div>`;
const card=l=>`<a class="card li" href="#anuncio-${l.id}">${ph(l)}<div class="b"><div class="pr">${P(l)}</div><div>${esc(l.t)}</div><div class="mu">${esc(l.s)} · ${l.c}</div></div></a>`;
const bd=s=>`<span class="bd s-${s}">${s}</span>`;
let LF=null;function M(h){LF=document.activeElement;const o=$('#md');o.innerHTML='<div class="card" role="dialog" aria-modal="true">'+h+'</div>';o.hidden=false;const f=o.querySelector('textarea,input,select,button,a');if(f)f.focus()}
function C0(){$('#md').hidden=true;if(LF&&LF.focus)LF.focus()}
const X='<button class="btn" data-a="x" type="button">Fechar</button>';

function vInicio(){return `<section class="hero"><h1>Compre e venda no seu bairro</h1><p>Anúncios do Poranga II reunidos em um só lugar. Fale direto com o vendedor pelo WhatsApp.</p>
<form data-f="busca" class="row"><input class="sp" id="hq" placeholder="O que você procura?" aria-label="Buscar"><button class="btn wa" style="width:auto;margin:0;padding:0 22px">Buscar</button></form></section>
<h2>Categorias</h2><div class="grid">${C.map(c=>`<button class="card cat" data-a="cat" data-v="${c[0]}"><span style="font-size:28px">${c[1]}</span><br>${c[0]}</button>`).join('')}</div>
<h2>Novos no bairro</h2><div class="grid">${pubs().slice(3,7).map(card).join('')}</div>
<div class="card warnb" style="margin-top:18px"><h3>Dica de segurança</h3><p class="mu" style="margin:0">Desconfie de quem pede pagamento adiantado. Confira o produto antes de pagar e prefira locais públicos.</p></div>
<p class="mu" style="margin-top:16px">Termos de Uso · Política de Privacidade · Suporte e denúncias</p>`}

function grid(){let a=pubs().filter(l=>(S.cat==='Todas'||l.c===S.cat)&&(S.cond==='Todas'||l.cd===S.cond)&&(l.t+' '+l.d).toLowerCase().includes(S.q.toLowerCase()));
 if(S.ord==='a')a.sort((x,y)=>(x.p??1e9)-(y.p??1e9));if(S.ord==='d')a.sort((x,y)=>(y.p??-1)-(x.p??-1));
 return a.length?a.map(card).join(''):'<div class="card" style="grid-column:1/-1"><h3>Nenhum anúncio encontrado</h3><p class="mu" style="margin:0">Tente outra palavra ou limpe os filtros.</p></div>'}
const chips=()=>['Todas',...C.map(c=>c[0])].map(c=>`<button class="chip ${S.cat===c?'on':''}" data-a="cat" data-v="${c}">${c}</button>`).join('');
const upd=()=>{if($('#g')){$('#g').innerHTML=grid();$('#ch').innerHTML=chips()}};
function vCatalogo(){return `<h1>Catálogo</h1><div class="row"><input class="sp" data-i="q" value="${esc(S.q)}" placeholder="Buscar produtos e serviços" aria-label="Buscar">
<select data-i="cond" aria-label="Condição" style="width:auto">${['Todas','Novo','Usado'].map(o=>`<option ${S.cond===o?'selected':''}>${o}</option>`).join('')}</select>
<select data-i="ord" aria-label="Ordenar" style="width:auto"><option value="n">Mais recentes</option><option value="a" ${S.ord==='a'?'selected':''}>Menor preço</option><option value="d" ${S.ord==='d'?'selected':''}>Maior preço</option></select></div>
<div class="chips" id="ch">${chips()}</div><div class="grid" id="g">${grid()}</div>`}

function vAnuncio(){const l=byId(S.sel);
 if(!l)return `<div class="card"><h1>Anúncio não encontrado</h1><p class="mu">O endereço não corresponde a nenhum anúncio.</p><a class="btn pri" href="#catalogo">Ver catálogo</a></div>`;
 if(l.st!=='PUBLICADO')return `<div class="card"><h1>Anúncio indisponível</h1><p class="mu">Este anúncio foi pausado, vendido ou retirado da publicação.</p><a class="btn pri" href="#catalogo">Ver outros anúncios</a></div>`;
 return `<a href="#catalogo">← Voltar ao catálogo</a><div class="two" style="margin-top:10px">${ph(l,'ph1','font-size:96px;')}
<div>${bd(l.st)}<h1 style="margin-top:6px">${esc(l.t)}</h1><div class="pr" style="font-size:26px">${P(l)}</div><p class="mu">${l.c} · ${l.cd} · ${l.v} visualizações</p>
<button class="btn wa" data-a="wa" data-v="${l.id}">💬 Conversar pelo WhatsApp</button><p>${esc(l.d)}</p>
<div class="card"><b>Atendimento:</b> ${esc(l.a)}<br><b>Vendedor:</b> ${esc(l.s)}<br><span class="mu">Poranga II (declarado pelo vendedor, não verificado)</span></div>
<div class="card warnb" style="margin:12px 0"><b>Compre com segurança</b><p class="mu" style="margin:4px 0 0">Não pague adiantado a desconhecidos e confira o produto antes. O VENDE+ apenas divulga anúncios e não participa da negociação.</p></div>
<div class="row"><button class="btn sm" data-a="share" data-v="${l.id}">🔗 Copiar link do anúncio</button><button class="btn dg sm" data-a="rep" data-v="${l.id}">🚩 Denunciar</button></div></div></div>`}

function vCadastro(){return `<h1>Criar conta de vendedor</h1><form class="card" data-f="cad"><label>Nome de exibição<input required minlength="2" placeholder="Ex.: Maria S."></label>
<label>Nome comercial (opcional)<input placeholder="Ex.: Doces da Maria"></label><label>E-mail<input type="email" required placeholder="voce@exemplo.com"></label>
<label>WhatsApp comercial<input type="tel" required placeholder="(92) 90000-0000"></label><p class="mu">Este número ficará acessível aos compradores interessados no seu anúncio.</p>
<label>Tipo de anunciante<select><option>Pessoa física</option><option>Negócio</option></select></label>
<label class="ck"><input type="checkbox" required>Declaro que tenho vínculo com o Poranga II.</label>
<label class="ck"><input type="checkbox" required>Tenho 18 anos ou mais.</label>
<label class="ck"><input type="checkbox" required>Li e aceito os Termos de Uso e a Política de Privacidade.</label>
<div id="cod" hidden><label>Código enviado ao seu contato<input placeholder="Use 123456 (fictício)" inputmode="numeric"></label></div>
<div class="row" style="margin-top:14px"><button type="button" class="btn" data-a="cod">Enviar código de confirmação</button><button class="btn pri">Criar conta</button></div>
<p class="mu" style="margin-top:12px">Não pedimos CPF, RG nem endereço completo.</p></form>`}

function vPublicar(){const lk=S.lock;return `<h1>Publicar anúncio</h1>${lk?'<div class="card warnb">Publicações estão temporariamente pausadas pela administração.</div>':''}
<form class="card" data-f="pub"><label>Título<input name="t" required minlength="5" maxlength="90" placeholder="Ex.: Bicicleta aro 26"></label>
<label>Categoria<select name="c">${C.map(c=>`<option>${c[0]}</option>`).join('')}</select></label>
<div class="row"><div class="sp"><label>Preço (R$)<input name="p" inputmode="decimal" placeholder="Ex.: 25,90 (obrigatório, exceto Serviços)"></label></div>
<div class="sp"><label>Condição<select name="cd"><option>Novo</option><option>Usado</option><option>Não aplicável</option></select></label></div></div>
<label>Descrição<textarea name="d" required minlength="10" maxlength="2000" placeholder="Descreva o produto ou serviço"></textarea></label>
<label>Forma de atendimento ou entrega<input name="a" required placeholder="Ex.: Retirada no bairro"></label>
<b class="lb">Fotos (1 a 5)</b><div class="row" id="fotos">${phs()}</div><p class="mu">No sistema real, as imagens serão validadas, reduzidas e terão metadados removidos.</p>
<button class="btn pri" style="width:100%;margin-top:8px" ${lk?'disabled':''}>Publicar</button></form>
<p class="mu">Dica para testar: escreva “pagamento antecipado” na descrição ou “armas” no título.</p>`}
const phs=()=>Array.from({length:S.ph},(_,i)=>`<div class="card" aria-hidden="true" style="width:56px;height:56px;display:grid;place-items:center;padding:0">🖼️</div>`).join('')+(S.ph<5?'<button type="button" class="btn sm" data-a="foto">+ Adicionar foto (simulado)</button>':'');

const risk=tx=>/\barmas?\b|cigarros?|vape|maconha/i.test(tx)?['BLOQUEADO','Item possivelmente proibido']:/pix antes|pagamento (antecipado|adiantado)/i.test(tx)?['EM_ANALISE','Possível pedido de pagamento antecipado']:null;
const TR={RASCUNHO:{PUBLICADO:'s',EM_ANALISE:'s',BLOQUEADO:'s'},PUBLICADO:{PAUSADO:'v',VENDIDO:'v',REMOVIDO:'va',EM_ANALISE:'sa'},PAUSADO:{PUBLICADO:'v',VENDIDO:'v',REMOVIDO:'va',EM_ANALISE:'s'},EM_ANALISE:{PUBLICADO:'a',BLOQUEADO:'a',REMOVIDO:'va'},BLOQUEADO:{PUBLICADO:'a',REMOVIDO:'a'},VENDIDO:{},REMOVIDO:{}};
const AT={s:'Sistema',v:'Vendedor',a:'Admin'};
function mv(l,to,who,why=''){let err='';const ok=(TR[l.st]||{})[to]||'';
 if(!ok.includes(who))err=`${l.st} → ${to} não é permitido para ${AT[who].toLowerCase()}.`;
 else if(to==='PUBLICADO'&&risk(l.t+' '+l.d)&&(risk(l.t+' '+l.d)[0]==='BLOQUEADO'||who==='v'))err='O conteúdo ainda viola as regras. O vendedor precisa regularizar o anúncio antes da publicação.';
 if(err){S.log.push(`${hora()} · ${AT[who]} · NEGADO · ${l.t} · ${err}`);return err}
 S.log.push(`${hora()} · ${AT[who]} · ${l.st} → ${to} · ${l.t}${why?' · '+why:''}`);l.st=to;return ''}
const deny=e=>M(`<h3>Ação não permitida</h3><p>${esc(e)}</p><p class="mu">A tentativa foi registrada na auditoria.</p>${X}`);
const vp=(raw,cat)=>{const t=String(raw).trim();if(!t)return cat==='Serviços'?{p:null}:{e:'Informe o preço. Só anúncios de Serviços podem ficar sob orçamento.'};
 if(/^-/.test(t))return{e:'O preço não pode ser negativo.'};
 if(!/^(\d{1,3}(\.\d{3})+|\d+)(,\d{1,2})?$/.test(t))return{e:'Formato inválido. Use apenas números, por exemplo 25,90 ou 1.250,00.'};
 const n=Math.round(parseFloat(t.replace(/\./g,'').replace(',','.'))*100);
 if(n<=0)return{e:'O preço deve ser maior que zero.'};if(n>100000000)return{e:'O preço máximo é R$ 1.000.000,00.'};return{p:n}};

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b){if(e.target.id==='md')C0();return}

 else if(a==='cp'){const k=$('#lk');k.select();try{navigator.clipboard.writeText(k.value).catch(()=>{})}catch(_){}b.textContent='Copiado ✔'}
 else if(a==='rep'){M(`<h3>Denunciar anúncio</h3><form data-f="rep" data-v="${v}"><label>Motivo<select><option>Golpe ou pagamento suspeito</option><option>Item ou serviço proibido</option><option>Informação falsa</option><option>Outro</option></select></label><label>Detalhes (opcional)<textarea maxlength="1000"></textarea></label><label class="ck"><input type="checkbox" required>Não sou um robô (verificação simulada)</label><div class="row" style="margin-top:12px"><button class="btn pri">Enviar denúncia</button>${X}</div></form>`)}
 else if(a==='cod'){$('#cod').hidden=false}
 else if(a==='foto'){S.ph++;$('#fotos').innerHTML=phs()}
 else if(a==='edit'){const l=byId(v),bl=l.st==='BLOQUEADO';M(`<h3>${bl?'Regularizar anúncio':'Editar anúncio'}</h3><p class="mu">${bl?'O anúncio continua bloqueado até a análise de um administrador. Ajuste o conteúdo e depois conteste.':'As mudanças passam pelas mesmas validações da publicação.'}</p><form data-f="edit" data-v="${v}"><label>Título<input name="t" required minlength="5" maxlength="90" value="${esc(l.t)}"></label><label>Preço (R$)<input name="p" inputmode="decimal" value="${brl(l.p)}"></label><label>Descrição<textarea name="d" required minlength="10" maxlength="2000">${esc(l.d)}</textarea></label><label>Atendimento ou entrega<input name="a" required value="${esc(l.a)}"></label><div class="row" style="margin-top:12px"><button class="btn pri">Salvar</button>${X}</div></form>`)}
 else if(a==='tg'){const l=byId(v);if(l.st==='PAUSADO'){const r=risk(l.t+' '+l.d);if(r){er=mv(l,'EM_ANALISE','s',r[1]);S.queue.push({k:'Automática',lid:l.id,why:'Reativação: '+r[1]});l.mr=r[1]}else er=mv(l,'PUBLICADO','v')}else er=mv(l,'PAUSADO','v');er?deny(er):render()}
 else if(a==='sold'){er=mv(byId(v),'VENDIDO','v');er?deny(er):render()}
 else if(a==='del'){er=mv(byId(v),'REMOVIDO','v','exclusão lógica');er?deny(er):render()}
 else if(a==='try'){er=mv(byId(v),'PUBLICADO','v');er?deny(er):render()}
 else if(a==='ctt'){if(S.ap.some(x=>x.lid==v))M(`<h3>Contestação já enviada</h3><p>Há uma contestação em análise para este anúncio. Cada decisão aceita uma contestação.</p>${X}`);else M(`<h3>Contestar decisão</h3><p class="mu">Explique por que o anúncio segue as regras. Resposta em até 48 h (meta).</p><form data-f="ctt" data-v="${v}"><label>Sua explicação<textarea required maxlength="500" minlength="10"></textarea></label><div class="row" style="margin-top:12px"><button class="btn pri">Enviar contestação</button>${X}</div></form>`)}
 else if(a==='lock'){S.lock=!S.lock;S.log.push(hora()+' · Admin · bloqueio emergencial '+(S.lock?'LIGADO':'desligado'));render()}
 else if(a==='mod'){const n={manter:'Manter anúncio',correcao:'Pedir correção',remover:'Remover anúncio',bloquear:'Bloquear anúncio'}[v];M(`<h3>${n}</h3><form data-f="mod" data-i="${i}" data-v="${v}"><label>Motivo (obrigatório e registrado)<textarea required minlength="5"></textarea></label><div class="row" style="margin-top:12px"><button class="btn pri">Confirmar</button>${X}</div></form>`)}
 else if(a==='ap'){const n=v==='aceitar'?'Aceitar contestação':'Negar contestação';M(`<h3>${n}</h3><p class="mu">A justificativa é obrigatória e fica registrada na auditoria. O vendedor também a verá.</p><form data-f="ap" data-i="${i}" data-v="${v}"><label>Justificativa<textarea required minlength="5"></textarea></label><div class="row" style="margin-top:12px"><button class="btn pri">Confirmar</button>${X}</div></form>`)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#md').hidden)C0()});

 else if(k==='rep'){S.queue.push({k:'Denúncia',lid:+v,why:'Denúncia de visitante: '+f.querySelector('select').value,det:tx.value.trim()});S.log.push(hora()+' · Visitante · denúncia recebida · '+byId(v).t+' · '+f.querySelector('select').value);C0();M(`<h3>Denúncia registrada (simulação)</h3><p>Ela já aparece na fila do painel de moderação.</p>${X}`)}
 else if(k==='ctt'){const l=byId(v);S.ap.push({lid:+v,txt:tx.value});S.log.push(hora()+' · Vendedor · contestação enviada · '+l.t);C0();M(`<h3>Contestação enviada</h3><p>Um administrador vai analisar. Veja a fila no painel Admin.</p>${X}`)}
 else if(k==='edit'){const l=byId(v),d=new FormData(f),pv=vp(d.get('p'),d.get('c')||(byId(v)||{}).c);if(pv.e){M(`<h3>Preço inválido</h3><p>${pv.e}</p>${X}`);return}const n=pv.p;
  Object.assign(l,{t:d.get('t'),d:d.get('d'),a:d.get('a'),p:n});const r=risk(l.t+' '+l.d);S.log.push(hora()+' · Vendedor · edição salva · '+l.t);

  else if(l.st==='EM_ANALISE'&&r&&r[0]==='BLOQUEADO')msg='O conteúdo ainda tem item possivelmente proibido e não poderá ser publicado sem regularização.';
  else if(l.st==='BLOQUEADO')msg=r?'O conteúdo ainda tem o problema apontado. O anúncio segue bloqueado.':'Conteúdo ajustado. O anúncio continua bloqueado até um administrador analisar a sua contestação.';
  C0();M(`<h3>Edição concluída</h3><p>${msg}</p>${X}`);if(S.r==='painel')render()}
 else if(k==='mod'){const q=S.queue[i],l=byId(q.lid),j=tx.value;

  else{er=l.st==='PUBLICADO'?mv(l,'EM_ANALISE','a','etapa para bloqueio'):'';if(!er)er=mv(l,'BLOQUEADO','a',j)}
  C0();if(er)deny(er);else{S.queue.splice(i,1);render()}}
 else if(k==='ap'){const x=S.ap[i],l=byId(x.lid),j=tx.value;
  if(v==='aceitar'){er=mv(l,'PUBLICADO','a','contestação aceita: '+j);if(er){C0();deny(er);return}l.mr='';l.resp='Contestação aceita. '+j}
  else{S.log.push(`${hora()} · Admin · contestação negada · ${l.t} · justificativa: ${j}`);l.resp='Contestação negada. '+j}
  S.ap.splice(i,1);C0();render()}
 else if(k==='pub'){if(S.lock)return;if(!S.ph){M(`<h3>Falta pelo menos 1 foto</h3><p>Adicione uma foto para publicar.</p>${X}`);return}
  const d=new FormData(f),pv=vp(d.get('p'),d.get('c')||(byId(v)||{}).c);if(pv.e){M(`<h3>Preço inválido</h3><p>${pv.e}</p>${X}`);return}const n=pv.p;
  const c=d.get('c'),l={id:L.length+1,o:1,t:d.get('t'),p:n,c,e:(C.find(x=>x[0]===c)||[0,'📦'])[1],g:G[c],s:'Doces da Marta',cd:d.get('cd'),d:d.get('d'),a:d.get('a'),st:'RASCUNHO',v:0,k:0,mr:''},r=risk(l.t+' '+l.d);

});
